<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberLearn - Formation Cybersécurité, Dev Web & Domaines</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; }
        
        /* ========== PAGE DE LOGIN / INSCRIPTION ========== */
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: white; border-radius: 30px; padding: 45px; width: 100%; max-width: 480px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .auth-header { text-align: center; margin-bottom: 35px; }
        .logo-icon { font-size: 60px; color: #667eea; margin-bottom: 15px; }
        .auth-header h1 { font-size: 32px; color: #1a1a2e; margin-bottom: 8px; }
        .auth-header p { color: #666; font-size: 14px; }
        .auth-tabs { display: flex; gap: 12px; margin-bottom: 35px; background: #f1f3f4; padding: 5px; border-radius: 50px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; cursor: pointer; font-size: 16px; border-radius: 40px; transition: all 0.3s; font-weight: 600; }
        .tab-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; box-shadow: 0 4px 15px rgba(102,126,234,0.3); }
        .auth-form { display: none; }
        .auth-form.active { display: block; animation: fadeIn 0.3s ease; }
        .input-group { position: relative; margin-bottom: 22px; }
        .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 18px; }
        .input-group input, .input-group select { width: 100%; padding: 14px 16px 14px 48px; border: 2px solid #e8e8e8; border-radius: 15px; font-size: 15px; transition: all 0.3s; background: #fafafa; }
        .input-group input:focus, .input-group select:focus { border-color: #667eea; outline: none; background: white; }
        .btn-primary { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 15px; font-size: 16px; cursor: pointer; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.4); }
        .auth-footer { text-align: center; margin-top: 25px; font-size: 14px; color: #666; }
        .auth-footer a { color: #667eea; text-decoration: none; font-weight: 600; cursor: pointer; }
        
        /* ========== PAGE CHAT INITIAL ========== */
        .chat-landing { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: linear-gradient(135deg, #667eea, #764ba2); }
        .chat-card { background: white; border-radius: 30px; max-width: 650px; width: 100%; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.3); animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .chat-header { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 35px; text-align: center; }
        .chat-header i { font-size: 55px; margin-bottom: 15px; }
        .chat-header h1 { font-size: 28px; margin-bottom: 8px; }
        .chat-header p { opacity: 0.9; font-size: 14px; }
        .chat-messages-area { height: 380px; overflow-y: auto; padding: 25px; background: #f8f9fa; }
        .message { margin-bottom: 18px; display: flex; }
        .message.user { justify-content: flex-end; }
        .message.bot { justify-content: flex-start; }
        .message-content { max-width: 80%; padding: 12px 18px; border-radius: 20px; font-size: 14px; line-height: 1.5; }
        .message.user .message-content { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-bottom-right-radius: 5px; }
        .message.bot .message-content { background: white; color: #333; border-bottom-left-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .typing { display: flex; gap: 5px; padding: 12px 18px; background: white; border-radius: 20px; width: fit-content; }
        .typing span { width: 8px; height: 8px; background: #999; border-radius: 50%; animation: typingAnim 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingAnim { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
        .chat-input-area { display: flex; padding: 18px 22px; background: white; border-top: 1px solid #eee; gap: 12px; }
        .chat-input-area input { flex: 1; padding: 14px 18px; border: 2px solid #e8e8e8; border-radius: 30px; font-size: 14px; outline: none; transition: 0.3s; }
        .chat-input-area input:focus { border-color: #667eea; }
        .chat-input-area button { background: linear-gradient(135deg, #667eea, #764ba2); border: none; color: white; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; transition: transform 0.2s; }
        .chat-input-area button:hover { transform: scale(1.05); }
        
        /* ========== DASHBOARD ========== */
        .dashboard { display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: white; box-shadow: 2px 0 15px rgba(0,0,0,0.08); }
        .sidebar-header { padding: 30px 20px; text-align: center; border-bottom: 1px solid #eee; }
        .sidebar-header i { font-size: 42px; color: #667eea; }
        .sidebar-header h2 { margin-top: 12px; font-size: 20px; color: #1a1a2e; }
        .sidebar-nav { padding: 20px 0; }
        .nav-item { display: flex; align-items: center; padding: 14px 25px; color: #555; cursor: pointer; transition: 0.3s; }
        .nav-item i { width: 28px; margin-right: 15px; font-size: 18px; }
        .nav-item:hover, .nav-item.active { background: #f0f0ff; color: #667eea; border-left: 3px solid #667eea; }
        .user-info { padding: 20px 25px; border-top: 1px solid #eee; display: flex; align-items: center; gap: 12px; }
        .user-avatar i { font-size: 45px; color: #667eea; }
        .user-details { flex: 1; }
        .user-details span { font-weight: 600; display: block; font-size: 14px; }
        .user-details small { color: #999; font-size: 11px; }
        .logout-btn { background: none; border: none; cursor: pointer; color: #ff4757; font-size: 22px; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; background: #f8f9fa; }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        .welcome-banner { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 35px; border-radius: 20px; margin-bottom: 30px; }
        .welcome-banner h1 { font-size: 28px; margin-bottom: 12px; }
        .courses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; margin-top: 20px; }
        .course-card { background: white; border-radius: 18px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); cursor: pointer; transition: all 0.3s; }
        .course-card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0,0,0,0.12); }
        .course-thumbnail { width: 100%; height: 170px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }
        .progress-bar { background: #e8e8e8; height: 8px; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .progress-fill { background: linear-gradient(135deg, #667eea, #764ba2); height: 100%; transition: width 0.3s; }
        .chat-container { background: white; border-radius: 20px; height: 520px; display: flex; flex-direction: column; overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 25px; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); }
        .modal-content { background: white; margin: 2% auto; padding: 20px; width: 90%; max-width: 1000px; border-radius: 20px; }
        .close { float: right; font-size: 28px; cursor: pointer; transition: 0.2s; }
        .close:hover { color: #ff4757; }
        .video-actions { margin-top: 20px; display: flex; gap: 15px; justify-content: center; }
        .btn-success { background: #00b894; color: white; padding: 12px 25px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; }
        .btn-chat { background: #667eea; color: white; padding: 12px 25px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; }
        .resume-card { text-align: center; background: linear-gradient(135deg, #f8f9fa, white); }
        @media (max-width: 768px) { .sidebar { width: 80px; } .sidebar-header h2, .nav-item span, .user-details { display: none; } .nav-item { justify-content: center; } .nav-item i { margin-right: 0; } .auth-card { padding: 30px 25px; } }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ==================== CONFIGURATION ====================
        const API_URL = '';
        let currentUser = null;
        let authToken = null;
        let tempDomain = null;
        let coursesList = [];

        // ==================== PAGE DE LOGIN / INSCRIPTION ====================
        function renderLoginPage() {
            document.getElementById('app').innerHTML = `
                <div class="auth-container">
                    <div class="auth-card">
                        <div class="auth-header">
                            <i class="fas fa-shield-haltered logo-icon"></i>
                            <h1>CyberLearn</h1>
                            <p>Formation en cybersécurité, développement web & domaines</p>
                        </div>
                        <div class="auth-tabs">
                            <button class="tab-btn active" data-tab="login">🔐 Connexion</button>
                            <button class="tab-btn" data-tab="register">📝 Inscription</button>
                        </div>
                        
                        <!-- FORMULAIRE DE CONNEXION -->
                        <form id="loginForm" class="auth-form active">
                            <div class="input-group">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="loginEmail" placeholder="Email" required>
                            </div>
                            <div class="input-group">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="loginPassword" placeholder="Mot de passe" required>
                            </div>
                            <button type="submit" class="btn-primary">Se connecter</button>
                        </form>
                        
                        <!-- FORMULAIRE D'INSCRIPTION avec EMAIL + TÉLÉPHONE -->
                        <form id="registerForm" class="auth-form">
                            <div class="input-group">
                                <i class="fas fa-user"></i>
                                <input type="text" id="regName" placeholder="Nom complet" required>
                            </div>
                            <div class="input-group">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="regEmail" placeholder="Email" required>
                            </div>
                            <div class="input-group">
                                <i class="fas fa-phone"></i>
                                <input type="tel" id="regPhone" placeholder="Numéro de téléphone" required>
                            </div>
                            <div class="input-group">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="regPassword" placeholder="Mot de passe" required>
                            </div>
                            <div class="input-group">
                                <i class="fas fa-shield-alt"></i>
                                <select id="regDomain" required>
                                    <option value="">Choisissez votre domaine</option>
                                    <option value="cybersecurite">🔒 Cybersécurité</option>
                                    <option value="developpement">💻 Développement Web</option>
                                    <option value="domaine">🌐 Noms de domaine & Hébergement</option>
                                </select>
                            </div>
                            <button type="submit" class="btn-primary">Créer mon compte</button>
                        </form>
                        
                        <div class="auth-footer">
                            <a id="switchToChatBtn">🤖 Ou discutez avec notre assistant pour définir vos objectifs</a>
                        </div>
                    </div>
                </div>
            `;
            
            // Gestion des onglets
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tab = btn.dataset.tab;
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
                    document.getElementById(`${tab}Form`).classList.add('active');
                });
            });
            
            document.getElementById('switchToChatBtn').onclick = (e) => {
                e.preventDefault();
                renderChatLanding();
            };
            
            // Connexion
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                
                try {
                    const response = await fetch(`${API_URL}/api/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const result = await response.json();
                    if (response.ok) {
                        localStorage.setItem('token', result.token);
                        authToken = result.token;
                        currentUser = result.user;
                        coursesList = result.courses || [];
                        renderDashboard();
                    } else {
                        alert(result.error || 'Email ou mot de passe incorrect');
                    }
                } catch (error) {
                    alert('Erreur de connexion');
                }
            });
            
            // Inscription
            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const data = {
                    name: document.getElementById('regName').value,
                    email: document.getElementById('regEmail').value,
                    phone: document.getElementById('regPhone').value,
                    password: document.getElementById('regPassword').value,
                    domain: document.getElementById('regDomain').value,
                    goal_level: 'debutant'
                };
                
                if (!data.domain) {
                    alert('Veuillez choisir un domaine');
                    return;
                }
                
                try {
                    const response = await fetch(`${API_URL}/api/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    const result = await response.json();
                    if (response.ok) {
                        localStorage.setItem('token', result.token);
                        authToken = result.token;
                        currentUser = result.user;
                        coursesList = result.courses || [];
                        renderDashboard();
                    } else {
                        alert(result.error || 'Erreur lors de l\'inscription');
                    }
                } catch (error) {
                    alert('Erreur serveur');
                }
            });
        }

        // ==================== PAGE CHAT POUR COMPRENDRE LES OBJECTIFS ====================
        function renderChatLanding() {
            document.getElementById('app').innerHTML = `
                <div class="chat-landing">
                    <div class="chat-card">
                        <div class="chat-header">
                            <i class="fas fa-robot"></i>
                            <h1>Définissons vos objectifs</h1>
                            <p>Parlez avec moi pour créer votre formation personnalisée</p>
                        </div>
                        <div class="chat-messages-area" id="chatMessagesArea">
                            <div class="message bot">
                                <div class="message-content">
                                    👋 <strong>Bonjour !</strong><br><br>
                                    Je suis votre assistant pédagogique. Pour vous proposer la meilleure formation, dites-moi :<br><br>
                                    • 🔒 <strong>Cybersécurité</strong> (protection, piratage, sécurité informatique)<br>
                                    • 💻 <strong>Développement web</strong> (HTML, CSS, JavaScript, React)<br>
                                    • 🌐 <strong>Noms de domaine & hébergement</strong> (DNS, serveurs)<br><br>
                                    <strong>Quel domaine vous intéresse ?</strong>
                                </div>
                            </div>
                        </div>
                        <div class="chat-input-area">
                            <input type="text" id="chatInput" placeholder="Écrivez votre réponse..." onkeypress="if(event.key==='Enter') sendChatMessage()">
                            <button onclick="sendChatMessage()"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            `;
        }

        let chatContext = { domain: null, level: null };

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            const messagesArea = document.getElementById('chatMessagesArea');
            messagesArea.innerHTML += `<div class="message user"><div class="message-content">${escapeHtml(message)}</div></div>`;
            input.value = '';
            messagesArea.scrollTop = messagesArea.scrollHeight;
            
            messagesArea.innerHTML += `<div class="message bot" id="typingIndicator"><div class="typing"><span></span><span></span><span></span></div></div>`;
            messagesArea.scrollTop = messagesArea.scrollHeight;
            
            try {
                const response = await fetch(`${API_URL}/api/chat/understand`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                
                document.getElementById('typingIndicator')?.remove();
                messagesArea.innerHTML += `<div class="message bot"><div class="message-content">${escapeHtml(data.response)}</div></div>`;
                messagesArea.scrollTop = messagesArea.scrollHeight;
                
                if (data.detectedDomain) chatContext.domain = data.detectedDomain;
                if (data.detectedLevel) chatContext.level = data.detectedLevel;
                
                if (chatContext.domain && !tempDomain) {
                    tempDomain = chatContext.domain;
                    setTimeout(() => {
                        messagesArea.innerHTML += `<div class="message bot">
                            <div class="message-content">
                                🎯 <strong>Parfait !</strong> Je vois que vous êtes intéressé par ${getDomainName(chatContext.domain)}.<br><br>
                                📚 Je vais préparer votre cours personnalisé avec les meilleures vidéos YouTube.<br><br>
                                <button onclick="redirectToRegister()" class="btn-primary" style="margin-top:10px; padding:12px 25px;">✅ Créer mon compte et commencer</button>
                            </div>
                        </div>`;
                        messagesArea.scrollTop = messagesArea.scrollHeight;
                    }, 800);
                }
            } catch (error) {
                document.getElementById('typingIndicator')?.remove();
                messagesArea.innerHTML += `<div class="message bot"><div class="message-content">❌ Désolé, une erreur s'est produite. Veuillez réessayer.</div></div>`;
            }
        }

        function getDomainName(domain) {
            const names = { cybersecurite: 'Cybersécurité', developpement: 'Développement Web', domaine: 'Noms de domaine' };
            return names[domain] || domain;
        }

        function redirectToRegister() {
            localStorage.setItem('preferredDomain', tempDomain);
            renderLoginPage();
            setTimeout(() => {
                const domainSelect = document.getElementById('regDomain');
                if (domainSelect && tempDomain) {
                    domainSelect.value = tempDomain;
                }
            }, 100);
        }

        // ==================== DASHBOARD ====================
        async function renderDashboard() {
            try {
                const profileRes = await fetch(`${API_URL}/api/profile`, { 
                    headers: { 'Authorization': `Bearer ${authToken}` } 
                });
                if (profileRes.ok) {
                    const profileData = await profileRes.json();
                    currentUser = profileData.user;
                    coursesList = profileData.courses || [];
                }
            } catch(e) { console.log(e); }
            
            const domainIcons = { cybersecurite: 'fa-shield-haltered', developpement: 'fa-code', domaine: 'fa-globe' };
            const domainNames = { cybersecurite: 'Cybersécurité', developpement: 'Développement Web', domaine: 'Noms de domaine' };
            const completedIds = currentUser?.completedVideos || [];
            const progressPercent = currentUser?.progress || 0;
            
            const coursesHTML = coursesList.map(course => `
                <div class="course-card" onclick="openVideo('${course.video_id}', '${escapeHtml(course.title)}', '${course.video_url}')">
                    <img src="${course.thumbnail}" class="course-thumbnail" onerror="this.src='https://via.placeholder.com/320x170?text=Formation'">
                    <h3>${escapeHtml(course.title.substring(0, 60))}</h3>
                    <p><i class="fab fa-youtube"></i> ${course.channel_name || 'YouTube Formation'}</p>
                    <div class="progress-bar"><div class="progress-fill" style="width: ${completedIds.includes(course.video_id) ? '100%' : '0%'}"></div></div>
                    ${completedIds.includes(course.video_id) ? '<span style="color:#00b894;">✓ Terminé</span>' : '<span style="color:#667eea;">📹 À regarder</span>'}
                </div>
            `).join('');
            
            const lastVideoId = currentUser?.lastVideoId;
            const lastVideoTitle = currentUser?.lastVideoTitle;
            const resumeHTML = lastVideoId ? `
                <div class="course-card resume-card">
                    <i class="fas fa-play-circle" style="font-size: 55px; color:#667eea; margin-bottom:15px;"></i>
                    <h3>${escapeHtml(lastVideoTitle || 'Continuer ma formation')}</h3>
                    <button onclick="openVideo('${lastVideoId}', '${escapeHtml(lastVideoTitle || '')}', '')" class="btn-primary" style="width:auto; padding:12px 30px;">▶ Reprendre la lecture</button>
                </div>
            ` : `<div class="course-card resume-card"><i class="fas fa-rocket" style="font-size: 55px; margin-bottom:15px;"></i><h3>Commencez votre premier module !</h3><p>Cliquez sur une vidéo ci-dessous</p></div>`;
            
            document.getElementById('app').innerHTML = `
                <div class="dashboard">
                    <aside class="sidebar">
                        <div class="sidebar-header"><i class="fas ${domainIcons[currentUser?.domain || 'cybersecurite']}"></i><h2>CyberLearn</h2></div>
                        <nav class="sidebar-nav">
                            <div class="nav-item active" data-page="home"><i class="fas fa-home"></i><span>Accueil</span></div>
                            <div class="nav-item" data-page="courses"><i class="fas fa-graduation-cap"></i><span>Mes formations</span></div>
                            <div class="nav-item" data-page="progress"><i class="fas fa-chart-line"></i><span>Progression</span></div>
                            <div class="nav-item" data-page="quizzes"><i class="fas fa-question-circle"></i><span>Quiz & Tests</span></div>
                            <div class="nav-item" data-page="chat"><i class="fas fa-comments"></i><span>Chat IA</span></div>
                        </nav>
                        <div class="user-info">
                            <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
                            <div class="user-details">
                                <span>${escapeHtml(currentUser?.name || 'Utilisateur')}</span>
                                <small>${domainNames[currentUser?.domain] || ''}</small>
                            </div>
                            <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
                        </div>
                    </aside>
                    <main class="main-content">
                        <div id="homePage" class="page active">
                            <div class="welcome-banner">
                                <h1>Bienvenue ${escapeHtml((currentUser?.name || '').split(' ')[0])} !</h1>
                                <p>Progression : ${progressPercent}% du cours complété</p>
                                <div class="progress-bar" style="height:12px;"><div class="progress-fill" style="width:${progressPercent}%"></div></div>
                            </div>
                            <div class="resume-section"><h2><i class="fas fa-play-circle"></i> Reprendre où vous étiez</h2>${resumeHTML}</div>
                            <div class="courses-section"><h2><i class="fas fa-star"></i> Vos modules de formation</h2><div class="courses-grid">${coursesHTML.slice(0, 3)}</div></div>
                        </div>
                        <div id="coursesPage" class="page"><h2>📚 Tous mes modules</h2><div class="courses-grid">${coursesHTML}</div></div>
                        <div id="progressPage" class="page">
                            <h2>📊 Ma progression détaillée</h2>
                            <div class="course-card">
                                <h3>Progression globale</h3>
                                <div class="progress-bar" style="height:25px;"><div class="progress-fill" style="width:${progressPercent}%; height:100%;"></div></div>
                                <p style="font-size:24px; font-weight:700; margin-top:15px;">${progressPercent}%</p>
                                <p>${completedIds.length} / ${coursesList.length} modules terminés</p>
                                ${progressPercent === 100 ? '<p style="color:#00b894; margin-top:15px;">🎉 Félicitations ! Vous avez terminé votre formation !</p>' : ''}
                            </div>
                        </div>
                        <div id="quizzesPage" class="page"><h2>📝 Quiz de compréhension</h2><div id="quizzesContainer" class="courses-grid">Chargement...</div></div>
                        <div id="chatPage" class="page">
                            <h2>💬 Assistant IA - Posez vos questions</h2>
                            <div class="chat-container">
                                <div id="dashboardChatMessages" class="chat-messages">
                                    <div class="message bot"><div class="message-content">👋 Bonjour ! Posez-moi toutes vos questions sur votre formation en ${domainNames[currentUser?.domain]}.</div></div>
                                </div>
                                <div class="chat-input-area">
                                    <input type="text" id="dashboardChatInput" placeholder="Votre question...">
                                    <button id="dashboardChatSend"><i class="fas fa-paper-plane"></i></button>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
                <div id="videoModal" class="modal">
                    <div class="modal-content">
                        <span class="close">&times;</span>
                        <div id="videoPlayer"></div>
                        <div class="video-actions">
                            <button id="markCompleteBtn" class="btn-success"><i class="fas fa-check-circle"></i> Marquer comme terminé</button>
                            <button id="askQuestionBtn" class="btn-chat"><i class="fas fa-comment"></i> Poser une question</button>
                        </div>
                    </div>
                </div>
            `;
            
            // Navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const page = item.dataset.page;
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    item.classList.add('active');
                    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                    document.getElementById(`${page}Page`).classList.add('active');
                    if (page === 'quizzes') loadQuizzes();
                    if (page === 'chat') initDashboardChat();
                });
            });
            
            document.getElementById('logoutBtn').onclick = () => {
                localStorage.removeItem('token');
                localStorage.removeItem('preferredDomain');
                renderLoginPage();
            };
            
            // Modal
            const modal = document.getElementById('videoModal');
            document.querySelector('.close').onclick = () => {
                modal.style.display = 'none';
                document.getElementById('videoPlayer').innerHTML = '';
            };
            window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
        }
        
        window.openVideo = (videoId, title, videoUrl) => {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('videoPlayer');
            const embedUrl = videoUrl || `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            player.innerHTML = `<iframe width="100%" height="480" src="${embedUrl}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            modal.style.display = 'block';
            
            document.getElementById('markCompleteBtn').onclick = async () => {
                try {
                    await fetch(`${API_URL}/api/progress`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                        body: JSON.stringify({ videoId, videoTitle: title })
                    });
                    alert('✓ Félicitations ! Module terminé. Votre progression a été mise à jour.');
                    renderDashboard();
                } catch(e) { alert('Erreur lors de la mise à jour'); }
                modal.style.display = 'none';
            };
            
            document.getElementById('askQuestionBtn').onclick = () => {
                modal.style.display = 'none';
                document.querySelector('[data-page="chat"]').click();
                setTimeout(() => {
                    const input = document.getElementById('dashboardChatInput');
                    if (input) input.value = `📺 Question sur la vidéo "${title}": `;
                }, 300);
            };
        };
        
        async function loadQuizzes() {
            try {
                const res = await fetch(`${API_URL}/api/quizzes`, { headers: { 'Authorization': `Bearer ${authToken}` } });
                const data = await res.json();
                const quizzes = data.quizzes || [];
                document.getElementById('quizzesContainer').innerHTML = quizzes.map((quiz, idx) => `
                    <div class="course-card">
                        <h3>📋 Quiz ${idx + 1}</h3>
                        <p style="margin:15px 0; font-weight:500;">${quiz.question}</p>
                        ${quiz.options.map((opt, optIdx) => `<div style="margin:10px 0;"><input type="radio" name="quiz${quiz.id}" value="${optIdx}"> <label>${opt}</label></div>`).join('')}
                        <button onclick="checkQuiz(${quiz.id}, ${quiz.correct})" class="btn-primary" style="margin-top:15px;">Valider ma réponse</button>
                        <div id="quizResult${quiz.id}" style="margin-top:12px;"></div>
                    </div>
                `).join('');
            } catch(e) { console.log(e); }
        }
        
        window.checkQuiz = async (quizId, correctIndex) => {
            const selected = document.querySelector(`input[name="quiz${quizId}"]:checked`);
            if (!selected) { alert('Sélectionnez une réponse'); return; }
            const isCorrect = parseInt(selected.value) === correctIndex;
            const resultDiv = document.getElementById(`quizResult${quizId}`);
            if (isCorrect) {
                resultDiv.innerHTML = '<span style="color:#00b894;"><i class="fas fa-check-circle"></i> ✓ Bonne réponse !</span>';
            } else {
                resultDiv.innerHTML = '<span style="color:#ff4757;"><i class="fas fa-times-circle"></i> ✗ Mauvaise réponse. Réessayez !</span>';
            }
        };
        
        async function initDashboardChat() {
            const messagesDiv = document.getElementById('dashboardChatMessages');
            const input = document.getElementById('dashboardChatInput');
            const sendBtn = document.getElementById('dashboardChatSend');
            
            const addMessage = (text, isUser) => {
                messagesDiv.innerHTML += `<div class="message ${isUser ? 'user' : 'bot'}"><div class="message-content">${escapeHtml(text)}</div></div>`;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            };
            
            const sendMessage = async () => {
                const msg = input.value.trim();
                if (!msg) return;
                addMessage(msg, true);
                input.value = '';
                addMessage('✍️ Je réfléchis...', false);
                try {
                    const res = await fetch(`${API_URL}/api/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                        body: JSON.stringify({ question: msg })
                    });
                    const data = await res.json();
                    messagesDiv.removeChild(messagesDiv.lastChild);
                    addMessage(data.answer, false);
                } catch(error) {
                    messagesDiv.removeChild(messagesDiv.lastChild);
                    addMessage("❌ Désolé, une erreur s'est produite. Veuillez réessayer.", false);
                }
            };
            
            sendBtn.onclick = sendMessage;
            input.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
        }
        
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
        
        // ==================== DÉMARRAGE ====================
        const token = localStorage.getItem('token');
        if (token) {
            authToken = token;
            fetch(`${API_URL}/api/profile`, { headers: { 'Authorization': `Bearer ${token}` } })
                .then(res => res.ok ? res.json() : Promise.reject())
                .then(data => { currentUser = data.user; coursesList = data.courses || []; renderDashboard(); })
                .catch(() => renderLoginPage());
        } else {
            renderLoginPage();
        }
    </script>
</body>
</html>
